services:
  # ---------------------------------------------------------------------------
  # TrustToPay Express Backend API (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: trusttopay-backend
    runtime: node
    region: oregon
    plan: free
    branch: Harman
    rootDir: ./
    buildCommand: npm install && npm --workspace backend run build
    startCommand: npm --workspace backend run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_USERS_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CODE_REVIEW_ENABLED
        value: "true"
      - key: CODE_REVIEW_FAIL_CLOSED
        value: "true"
      - key: ELASTIC_ENABLED
        value: "true"
      - key: ELASTIC_INDEX_SPECIALISTS
        value: trusttopay-specialists-v1
      - key: JINA_EMBEDDING_MODEL
        value: jina-embeddings-v3
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_PAYOUTS_ENABLED
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # TrustToPay React Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: static_site
    name: trusttopay-frontend
    region: oregon
    plan: free
    branch: Harman
    rootDir: ./
    buildCommand: npm install && npm --workspace frontend run build
    publishDir: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
